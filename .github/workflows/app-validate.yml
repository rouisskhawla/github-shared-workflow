name: App Validation

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-dir:
        required: true
        type: string
      service-type:
        required: false
        type: string
        default: 'backend'
      java-version:
        required: false
        type: string
        default: '17'
      node-version:
        required: false
        type: string
        default: '24'

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        if: inputs.service-type == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Run backend tests
        if: inputs.service-type == 'backend'
        working-directory: ${{ inputs.service-dir }}
        run: mvn test

      - name: Set up Node
        if: inputs.service-type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm ci

      - name: Run frontend tests
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm run test
