name: App Validation

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-dir:
        required: true
        type: string
      service-key:
        required: true
        type: string
      service-type:
        required: false
        type: string
        default: 'backend'
      java-version:
        required: false
        type: string
        default: '17'
      node-version:
        required: false
        type: string
        default: '24.18.0'
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      NVD_API_KEY:
        required: true

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: inputs.service-type == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Run backend tests
        if: inputs.service-type == 'backend'
        working-directory: ${{ inputs.service-dir }}
        run: mvn test

      - name: Set up Node
        if: inputs.service-type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm ci

      - name: Run frontend tests
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm run test

  sonar:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        if: inputs.service-type == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Run SonarQube analysis (backend)
        if: inputs.service-type == 'backend'
        working-directory: ${{ inputs.service-dir }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify sonar:sonar \
            -Ddependency-check.skip=true \
            -Dsonar.projectKey=${{ inputs.service-key }} \
            -Dsonar.projectName=${{ inputs.service-name }} \
            -Dsonar.qualitygate.wait=true

      - name: Set up Node
        if: inputs.service-type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm ci

      - name: Run tests with coverage
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: |
          npm run test -- --no-watch --coverage
          ls -R
          find . -name "lcov.info"

      - name: Run SonarQube analysis (frontend)
        if: inputs.service-type == 'frontend'
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ${{ inputs.service-dir }}
          args: >
            -Dsonar.projectKey=${{ inputs.service-key }}
            -Dsonar.projectName=${{ inputs.service-name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-scan:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: inputs.service-type == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: OWASP Dependency Check (backend)
        if: inputs.service-type == 'backend'
        working-directory: ${{ inputs.service-dir }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn dependency-check:check -DfailOnError=false

      - name: Upload OWASP report (backend)
        if: inputs.service-type == 'backend' && always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/target/dependency-check-report.html

      - name: Set up Node
        if: inputs.service-type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies (frontend)
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: npm ci
        
      - name: npm audit (frontend)
        if: inputs.service-type == 'frontend'
        working-directory: ${{ inputs.service-dir }}
        run: |
          npm audit --audit-level=high --json > npm-audit.json

      - name: Upload npm audit report (frontend)
        if: inputs.service-type == 'frontend' && always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/npm-audit.json